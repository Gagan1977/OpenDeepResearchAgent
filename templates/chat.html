<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Deep Research</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="chat-page">

    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/" class="sidebar-logo">OpenDeepResearch</a>
            <button class="new-chat-btn">+ New chat</button>
        </div>

        <div class="sidebar-history">
            <p class="history-label">Recents</p>
            <ul id="history-list">
                {% for item in history %}
                <li title="{{ item }}">
                    <a href="/chat?q={{ item }}">{{ item }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </aside>

    <main class="chat-main">

        <div class="chat-topbar">
            <span>Open Deep Research</span>
        </div>

        <div class="chat-centered" id="chat-centered">
            <h2 class="centered-title">What would you like to research?</h2>
            <form action="/research" method="post" class="research-form">
                <div class="input-box">
                    <textarea
                        name="question"
                        placeholder="Ask a research question."
                        rows="1"
                    ></textarea>
                    <button type="submit">Send</button>
                </div>
            </form>
            <p class="input-hint">Press Enter to send · Shift + Enter for new line</p>
        </div>

        <!-- <div class="chat-input-area" id="chat-input-area" style="display:none;">
            <div class="input-box">
                <textarea
                    id="question-input-bottom"
                    placeholder="Ask a research question..."
                    rows="1"
                    onkeydown="handleKeyDownBottom(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button id="send-btn-bottom" onclick="sendQuestionBottom()">Send</button>
            </div>
            <p class="input-hint">Press Enter to send · Shift + Enter for new line</p>
        </div> -->

    </main>

    <!-- <script src="/static/script.js"></script> -->

</body>
</html>
